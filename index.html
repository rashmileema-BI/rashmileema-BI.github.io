<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rashmi Leema | Data Analyst (SQL, Python, Excel Automation)</title>
<meta name="description" content="Data analyst specialising in SQL, Python and Excel automation. I build reporting models, SQL data layers and dashboards that replace manual work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120;        /* primary: deep obsidian slate for hero, nav, footer */
  --ink-soft:#1E293B;   /* elevated dark surface */
  --teal:#4F46E5;       /* primary accent: modern electric indigo */
  --teal-hover:#4338CA; /* deeper indigo for hover states */
  --cyan:#06B6D4;       /* secondary highlight: vibrant cyan */
  --mint:#EEF2FF;       /* soft indigo tint for chips, badges & icon boxes */
  --paper:#F8FAFC;      /* crisp cool alabaster canvas */
  --white:#FFFFFF;      /* pure white card surface */
  --text:#334155;       /* high-contrast slate body copy */
  --soft:#64748B;       /* muted slate supporting text */
  --line:#E2E8F0;       /* subtle structural hairline border */
  --onink:#94A3B8;      /* readable muted text on dark backgrounds */
  --shadow-sm:0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.02);
  --shadow-md:0 12px 28px -6px rgba(15,23,42,.07), 0 4px 10px -3px rgba(15,23,42,.03);
  --shadow-lg:0 20px 38px -10px rgba(79,70,229,.15), 0 8px 16px -6px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:74px}
body{background:var(--paper);color:var(--text);font:16.5px/1.65 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em;font-weight:800;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.dark :focus-visible,.top :focus-visible,footer :focus-visible{outline-color:var(--cyan)}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}

/* icons (Lucide, outline, 24px grid, 2px stroke) */
.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}
.ic{display:inline-flex;align-items:center;gap:8px}

/* bands */
.band{padding:72px 0}
.band.white{background:var(--white)}
.band.dark{
  background:
    radial-gradient(circle at 85% 15%, rgba(79,70,229,.28), transparent 42%),
    radial-gradient(circle at 12% 85%, rgba(6,182,212,.18), transparent 38%),
    var(--ink);
  color:#fff;
}

/* sticky nav */
.top{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 10px 30px -10px rgba(2,6,23,.6)}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 28px;max-width:1080px;margin:0 auto}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;text-decoration:none;color:#fff;letter-spacing:-.02em}
.logo-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#fff}
nav ul{display:flex;gap:4px;list-style:none;padding:0}
nav ul a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--onink);transition:background .2s,color .2s}
nav ul a .i{width:15px;height:15px;opacity:.75}
nav ul a:hover{background:rgba(255,255,255,.08);color:#fff}
nav ul a.active{background:rgba(79,70,229,.25);color:#fff;box-shadow:inset 0 0 0 1px rgba(129,140,248,.35)}
nav ul a.active .i{color:#818CF8;opacity:1}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center}
.photo{width:194px;height:194px;border-radius:50%;background:var(--paper) center/cover;border:4px solid rgba(129,140,248,.35);box-shadow:0 0 0 8px rgba(79,70,229,.12), 0 20px 40px -15px rgba(0,0,0,.6)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(79,70,229,.2);border:1px solid rgba(129,140,248,.35);color:#C7D2FE;padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:14px}
.eyebrow .i{width:15px;height:15px;color:var(--cyan)}
.hero h1{font-size:clamp(30px,4.4vw,46px);color:#fff}
.hero p{margin:16px 0 22px;color:#CBD5E1;font-size:18px;max-width:60ch}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.stack span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#F1F5F9;padding:5px 13px;border-radius:8px;font-size:13.5px;font-weight:600;backdrop-filter:blur(4px)}
.stack span .i{width:14px;height:14px;color:#38BDF8}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,var(--teal),#4338CA);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 20px -6px rgba(79,70,229,.5);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:var(--teal-hover);transform:translateY(-1px);box-shadow:0 12px 24px -6px rgba(79,70,229,.65)}
.hero .btn{background:#fff;color:var(--ink);box-shadow:0 10px 25px -5px rgba(0,0,0,.25)}
.hero .btn:hover{background:var(--mint);color:var(--teal)}
.hero .btn.alt{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none}
.hero .btn.alt:hover{background:rgba(255,255,255,.14);color:#fff}
.hero .quick{margin:18px 0 0;font-size:14.5px;color:var(--onink);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hero .quick a{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#E2E8F0;text-decoration:none;transition:color .2s}
.hero .quick a:hover{color:var(--cyan)}
.hero .quick a .i{width:15px;height:15px;color:#818CF8}

/* stats strip */
.stats{background:var(--white);border-bottom:1px solid var(--line);padding:32px 0;box-shadow:var(--shadow-sm)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.stat{display:flex;flex-direction:column;align-items:center;padding:8px}
.stat-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--mint);color:var(--teal);margin-bottom:10px}
.stat b{display:block;font-size:clamp(26px,3.4vw,36px);font-weight:800;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.stat span{display:block;margin-top:6px;font-size:14px;color:var(--soft);font-weight:500}

/* titles */
.title{margin-bottom:30px}
.sec-badge{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--teal);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.sec-badge .i{width:14px;height:14px}
.title h2{font-size:clamp(26px,3.4vw,34px)}
.title p{color:var(--soft);margin-top:6px;max-width:60ch}

/* core skills */
.core{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.sk{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:16px;padding:28px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s}
.sk:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.sk .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--mint);color:var(--teal);margin-bottom:16px}
.sk h3{font-size:21px;margin-bottom:8px}
.sk p{color:var(--text);font-size:15.5px}
.sk .where{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--soft);display:flex;align-items:center;gap:6px}
.sk .where .i{width:15px;height:15px;color:var(--teal)}
.sk .where b{color:var(--ink)}
.also{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--soft);font-size:14.5px}
.also b{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.also b .i{width:16px;height:16px;color:var(--teal)}

/* tags */
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.tags span{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700}
.also .tags{margin:0}
.also .tags span{background:var(--white)}

/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:start}
.about p{color:var(--text);margin-bottom:14px;font-size:17px}
.offer{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow-sm)}
.offer h3{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:16px}
.offer h3 .i{color:var(--teal)}
.offer ul{list-style:none;padding:0;display:grid;gap:14px;color:var(--text);font-size:15.5px}
.offer li{display:flex;gap:12px;align-items:flex-start}
.offer li .i{color:var(--teal);margin-top:3px;background:var(--mint);padding:4px;width:26px;height:26px;border-radius:7px}

/* screenshots (hide themselves if the image is missing) */
.shot{border-radius:12px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in}

/* featured */
.feature{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:34px;margin-bottom:24px;box-shadow:var(--shadow-md)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--teal);padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700}
.chip.ic{display:inline-flex;gap:6px}
.chip .i{width:15px;height:15px}
.chip.success{background:#ECFDF5;color:#059669;border:1px solid #A7F3D0}
.feature h3{font-size:clamp(23px,2.8vw,29px);margin:12px 0}
.feature dl{display:grid;gap:12px;margin:16px 0 20px}
.feature dt{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--teal)}
.feature dt .i{width:15px;height:15px}
.feature dd{color:var(--text);font-size:15.5px;margin:2px 0 0}

/* pipeline strip */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 24px;counter-reset:s}
.flow div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;color:var(--soft);counter-increment:s;box-shadow:var(--shadow-sm);position:relative}
.flow b{display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:15px;margin-bottom:6px}
.flow b span{display:inline-flex;align-items:center}
.flow b span::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px}
.flow b .i{width:16px;height:16px;color:var(--teal);opacity:.8}

/* Fraud Hub gallery */
.gallery{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
.gallery h3{display:flex;align-items:center;gap:10px;font-size:21px}
.gallery h3 .i{color:var(--teal)}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px}
.gtabs button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;transition:all .2s}
.gtabs button .i{width:16px;height:16px;color:var(--soft)}
.gtabs button:hover{background:var(--mint);color:var(--teal);border-color:#C7D2FE}
.gtabs button:hover .i{color:var(--teal)}
.gtabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.gtabs button[aria-selected="true"] .i{color:#fff}
.gpanel[hidden]{display:none}
.gpanel .shot{background:var(--ink)}
.gpanel video{display:block;width:100%;height:auto;border-radius:10px;background:var(--ink)}
.gcap{margin-top:12px;color:var(--soft);font-size:15px;max-width:80ch}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(11,17,32,.93);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}

/* projects: 2 x 2 */
.proj{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.pc{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;text-decoration:none;box-shadow:var(--shadow-sm);transition:box-shadow .25s,transform .25s,border-color .25s}
.pc:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);border-color:#C7D2FE}
.pc .shot{margin-bottom:16px}
.pc .shot img{cursor:inherit}
.pc .chip{align-self:flex-start}
.pc h3{font-size:19.5px;margin:12px 0 8px}
.pc p{color:var(--soft);font-size:15.5px}
.pc .result{flex:1;margin-top:12px;font-weight:700;font-size:15px;color:var(--ink);padding-top:12px;border-top:1px dashed var(--line)}
.pc .tags{margin:16px 0 0}
.pc .more{margin-top:16px;font-weight:700;color:var(--teal);font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.pc:hover .more{text-decoration:underline;text-underline-offset:4px}

/* code showcase */
.code-card{margin-top:24px;background:#0F172A;border-radius:16px;overflow:hidden;border:1px solid #1E293B;box-shadow:var(--shadow-md)}
.code-card header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:#1E293B;color:var(--onink);font-size:14px}
.code-card header b{display:inline-flex;align-items:center;gap:8px;color:#fff}
.code-card header b .i{color:#38BDF8}
.code-card pre{margin:0;padding:22px;overflow-x:auto;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#E2E8F0}
.code-card .k{color:#818CF8;font-weight:700}
.code-card .f{color:#38BDF8}
.code-card .c{color:#64748B}

/* experience */
.xp{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.job{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:16px;padding:28px;box-shadow:var(--shadow-sm)}
.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.job time{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-size:13.5px;font-weight:700;background:var(--white);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.job time .i{width:14px;height:14px;color:var(--teal)}
.job h3{font-size:20px;margin:8px 0 4px}
.job .co{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;margin-bottom:14px;font-size:15.5px}
.job .co .i{width:16px;height:16px}
.job ul{padding-left:20px;display:grid;gap:10px;color:var(--text);font-size:15.5px}
.job ul li::marker{color:var(--teal)}

/* education */
.edugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.edc{display:flex;gap:18px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-sm)}
.edc .ico{display:grid;place-items:center;flex:none;width:54px;height:54px;border-radius:14px;background:var(--mint);color:var(--teal)}
.edc .ico .i{width:26px;height:26px}
.edc time{display:inline-flex;align-items:center;gap:5px;color:var(--soft);font-size:13.5px;font-weight:700}
.edc h3{font-size:20px;margin:6px 0 2px}
.edc .co{color:var(--teal);font-weight:700}
.edc p{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:15px;margin-top:10px;background:var(--paper);padding:4px 10px;border-radius:6px;border:1px solid var(--line);font-weight:600}
.edc p .i{width:15px;height:15px;color:var(--teal)}

/* certificates */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.cert{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s}
.cert:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.cert .shot{margin-bottom:16px;background:var(--white)}
.cert .shot img{cursor:zoom-in}
.cert-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cert .badge{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--mint);color:var(--teal)}
.cert h3{font-size:19px;margin-bottom:2px}
.cert .co{color:var(--teal);font-weight:700;font-size:15px}
.cert p{color:var(--soft);font-size:14.5px;margin:10px 0 16px;flex:1}
.cert .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cert .verify{margin-top:16px;padding:10px 1
